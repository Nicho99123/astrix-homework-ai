
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d19">
<title>ASTRIX AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:#edf4ff;
 font-family:Arial,sans-serif;height:100dvh;
 display:flex;flex-direction:column;
}
header{
 padding:17px 20px;background:#0d1525;
 border-bottom:1px solid #1b2c45;
 display:flex;align-items:center;gap:12px;
}
.logo{
 width:42px;height:42px;border-radius:13px;
 background:linear-gradient(135deg,#168bff,#713bff);
 display:grid;place-items:center;font-size:23px;
 font-weight:bold;
}
.brand{font-size:21px;font-weight:bold;letter-spacing:2px}
.status{font-size:11px;color:#48dca0;margin-top:4px}
#clear{
 margin-left:auto;background:#17243a;color:#a9c8ed;
 border:0;border-radius:10px;padding:10px;
}
main{
 flex:1;overflow-y:auto;padding:20px 15px;
 display:flex;flex-direction:column;gap:17px;
}
.welcome{text-align:center;margin:auto 0}
.welcome .symbol{
 font-size:55px;margin-bottom:12px;
}
.welcome h1{font-size:28px;margin:8px}
.welcome p{color:#8da5c5;line-height:1.6}
.message{
 max-width:88%;padding:13px 15px;border-radius:17px;
 line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;
}
.user{
 align-self:flex-end;background:#174d91;
 border-bottom-right-radius:5px;
}
.bot{
 align-self:flex-start;background:#131f32;
 border:1px solid #203550;border-bottom-left-radius:5px;
}
.bot strong{color:#54b8ff}
.preview{
 max-width:190px;max-height:180px;border-radius:12px;
 display:block;margin-bottom:8px;
}
.typing{color:#80a6d2;font-size:13px;padding:5px}
footer{
 padding:12px 12px calc(12px + env(safe-area-inset-bottom));
 background:#0d1525;border-top:1px solid #1b2c45;
}
#preview{display:none;padding:5px 10px}
#preview img{max-height:90px;max-width:100px;border-radius:9px}
.composer{
 display:flex;align-items:flex-end;gap:8px;
 background:#17243a;border:1px solid #2a405e;
 border-radius:18px;padding:8px;
}
.composer textarea{
 flex:1;min-width:0;resize:none;max-height:120px;
 border:0;outline:0;background:transparent;color:white;
 font:15px Arial;padding:10px;
}
.tool{
 width:40px;height:40px;flex-shrink:0;border:0;
 border-radius:12px;background:#243753;color:#b9d7ff;
 font-size:19px;
}
#send{
 background:linear-gradient(135deg,#168bff,#6746ed);
 color:white;font-size:18px;
}
button{cursor:pointer}
button:disabled{opacity:.5}
.note{text-align:center;font-size:10px;color:#7186a5;margin-top:9px}
</style>
</head>

<body>

<header>
 <div class="logo">A</div>
 <div>
  <div class="brand">ASTRIX</div>
  <div class="status">● AI HOMEWORK ASSISTANT</div>
 </div>
 <button id="clear">Clear</button>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <div class="symbol">✦</div>
  <h1>HELLO, STUDENT.</h1>
  <p>I'm ASTRIX, your AI homework assistant.<br>
  Ask me anything or upload a worksheet!</p>
 </div>
</main>

<footer>
 <div id="preview">
  <img id="previewImage" alt="Selected worksheet">
  <button id="removeImage" class="tool">×</button>
 </div>

 <div class="composer">
  <button class="tool" id="upload" title="Upload image">＋</button>
  <button class="tool" id="camera" title="Take photo">📷</button>
  <textarea id="message" rows="1"
   placeholder="Ask ASTRIX anything..."></textarea>
  <button class="tool" id="send" title="Send">➤</button>
 </div>

 <input id="file" type="file" accept="image/*" hidden>
 <input id="cameraFile" type="file" accept="image/*"
  capture="environment" hidden>
 <div class="note">ASTRIX AI • Powered by Gemini</div>
</footer>

<script>
const API_URL =
 "https://astrix-homework-api.nicholasrein9.workers.dev";

const chat = document.getElementById("chat");
const message = document.getElementById("message");
const send = document.getElementById("send");
const file = document.getElementById("file");
const cameraFile = document.getElementById("cameraFile");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");

let selectedImage = null;

function addMessage(text, type, imageUrl) {
 const welcome = document.getElementById("welcome");
 if(welcome) welcome.remove();

 const div = document.createElement("div");
 div.className = "message " + type;

 if(imageUrl){
  const img = document.createElement("img");
  img.src = imageUrl;
  img.className = "preview";
  div.appendChild(img);
 }

 const content = document.createElement("div");
 content.textContent = text;
 div.appendChild(content);

 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
 return div;
}

function selectImage(input) {
 const selected = input.files[0];
 if(!selected) return;

 if(!["image/jpeg","image/png","image/webp"].includes(selected.type)){
  alert("Please select a JPG, PNG, or WEBP image.");
  input.value = "";
  return;
 }

 if(selected.size > 5 * 1024 * 1024){
  alert("Image must be smaller than 5 MB.");
  input.value = "";
  return;
 }

 const reader = new FileReader();

 reader.onload = () => {
  selectedImage = {
   base64: reader.result.split(",")[1],
   mimeType: selected.type,
   url: reader.result
  };

  previewImage.src = reader.result;
  preview.style.display = "block";
 };

 reader.readAsDataURL(selected);
}

document.getElementById("upload").onclick = () => file.click();
document.getElementById("camera").onclick = () => cameraFile.click();

file.onchange = () => selectImage(file);
cameraFile.onchange = () => selectImage(cameraFile);

document.getElementById("removeImage").onclick = () => {
 selectedImage = null;
 file.value = "";
 cameraFile.value = "";
 preview.style.display = "none";
};

async function sendMessage(){
 const text = message.value.trim();

 if(!text && !selectedImage) return;

 const image = selectedImage;
 addMessage(text || "Please solve this worksheet.", "user",
  image?.url);

 message.value = "";
 selectedImage = null;
 file.value = "";
 cameraFile.value = "";
 preview.style.display = "none";

 send.disabled = true;

 const loading = addMessage("ASTRIX is thinking...", "bot");

 try {
  const payload = {message:text};

  if(image){
   payload.imageBase64 = image.base64;
   payload.mimeType = image.mimeType;
  }

  const response = await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(payload)
  });

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.details || data.error || "Request failed.");
  }

  if(!data.answer){
   throw new Error("ASTRIX returned an empty response.");
  }

  loading.textContent = data.answer;

 } catch(error){
  loading.textContent = "Sorry! ASTRIX encountered an error:\n" +
   error.message + "\n\nPlease try again.";
 } finally {
  send.disabled = false;
  message.focus();
  chat.scrollTop = chat.scrollHeight;
 }
}

send.onclick = sendMessage;

message.addEventListener("keydown", e => {
 if(e.key === "Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

message.addEventListener("input", () => {
 message.style.height = "auto";
 message.style.height = Math.min(message.scrollHeight,120) + "px";
});

document.getElementById("clear").onclick = () => {
 chat.innerHTML = `
 <div class="welcome" id="welcome">
 <div class="symbol">✦</div>
 <h1>HELLO, STUDENT.</h1>
 <p>I'm ASTRIX, your AI homework assistant.<br>
 Ask me anything or upload a worksheet!</p>
 </div>`;
};
</script>
</body>
</html>
