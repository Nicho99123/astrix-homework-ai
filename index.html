<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d19">
<link rel="icon" type="image/png" href="astrix-icon.png">
<title>ASTRIX</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;background:#080d19;color:#edf4ff;
  font-family:Arial,sans-serif;height:100dvh;
  display:flex;flex-direction:column;
}
header{
  min-height:78px;padding:10px 16px;background:#0d1525;
  border-bottom:1px solid #1b2c45;
  display:flex;align-items:center;gap:12px;
}
.header-icon{
  width:58px;height:58px;object-fit:contain;flex-shrink:0;
}
.brand{font-size:22px;font-weight:bold;letter-spacing:2px}
#clear{
  margin-left:auto;background:#17243a;color:#a9c8ed;
  border:0;border-radius:10px;padding:10px 13px;
}
main{
  flex:1;overflow-y:auto;padding:20px 15px;
  display:flex;flex-direction:column;gap:17px;
}
.welcome{text-align:center;margin:auto 0}
.welcome .symbol{font-size:55px;margin-bottom:12px;color:#70c9ff}
.welcome h1{font-size:27px;margin:8px}
.welcome p{color:#8da5c5;line-height:1.6}
.message{
  max-width:92%;padding:13px 15px;border-radius:17px;
  line-height:1.6;overflow-wrap:anywhere;
}
.user{
  align-self:flex-end;background:#174d91;
  border-bottom-right-radius:5px;white-space:pre-wrap;
}
.bot{
  align-self:flex-start;background:#131f32;
  border:1px solid #203550;border-bottom-left-radius:5px;
}
.bot strong{color:#70c9ff}
.bot h1,.bot h2,.bot h3{line-height:1.25;margin:14px 0 8px}
.bot h1{font-size:1.35rem}
.bot h2{font-size:1.2rem}
.bot h3{font-size:1.08rem}
.bot p{margin:8px 0}
.bot ul,.bot ol{padding-left:23px;margin:8px 0}
.bot li{margin:5px 0}
.bot blockquote{
  border-left:3px solid #4caeff;margin:10px 0;padding:3px 12px;
  color:#b9cce4;
}
.bot pre{
  overflow-x:auto;white-space:pre;padding:12px;
  background:#080d19;border:1px solid #263c59;border-radius:10px;
}
.bot code{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  overflow-wrap:anywhere;
}
.bot :not(pre)>code{
  background:#263852;padding:2px 5px;border-radius:5px;
}
.bot a{color:#75c8ff}
.preview{
  max-width:190px;max-height:180px;border-radius:12px;
  display:block;margin-bottom:8px;
}
.typing{color:#80a6d2;font-size:13px;padding:5px}
footer{
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:#0d1525;border-top:1px solid #1b2c45;
}
#preview{display:none;padding:5px 10px}
#preview img{max-height:90px;max-width:100px;border-radius:9px}
.composer{
  display:flex;align-items:flex-end;gap:8px;
  background:#17243a;border:1px solid #2a405e;
  border-radius:18px;padding:8px;
}
.composer textarea{
  flex:1;min-width:0;resize:none;max-height:120px;
  border:0;outline:0;background:transparent;color:white;
  font:15px Arial;padding:10px;
}
.tool{
  width:42px;height:42px;flex-shrink:0;border:0;
  border-radius:12px;background:#243753;color:#b9d7ff;
  display:grid;place-items:center;
}
.tool svg{width:22px;height:22px;stroke:currentColor}
#send{
  background:linear-gradient(135deg,#168bff,#6746ed);
  color:white;font-size:18px;
}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.note{text-align:center;font-size:10px;color:#7186a5;margin-top:9px}
@media(max-width:420px){
  header{min-height:70px}
  .header-icon{width:52px;height:52px}
  .brand{font-size:20px}
  .message{max-width:96%}
}
</style>
</head>
<body>
<header>
  <img class="header-icon" src="astrix-icon.png" alt="ASTRIX logo">
  <div class="brand">ASTRIX</div>
  <button id="clear" type="button">Clear</button>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="symbol">✦</div>
    <h1>WHAT ARE WE WORKING ON?</h1>
    <p>Ask a question or upload a worksheet.</p>
  </div>
</main>

<footer>
  <div id="preview">
    <img id="previewImage" alt="Selected worksheet">
    <button id="removeImage" class="tool" type="button" aria-label="Remove image">×</button>
  </div>

  <div class="composer">
    <button class="tool" id="upload" type="button" title="Upload image" aria-label="Upload image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tool" id="camera" type="button" title="Take photo" aria-label="Take photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <textarea id="message" rows="1" placeholder="Ask ASTRIX anything..." aria-label="Message"></textarea>
    <button class="tool" id="send" type="button" title="Send" aria-label="Send">➤</button>
  </div>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="cameraFile" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
  <div class="note">Powered by Gemini</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
const API_URL = "https://astrix-homework-api.nicholasrein9.workers.dev";
const chat = document.getElementById("chat");
const message = document.getElementById("message");
const send = document.getElementById("send");
const file = document.getElementById("file");
const cameraFile = document.getElementById("cameraFile");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");

let selectedImage = null;

if (window.marked) {
  marked.setOptions({gfm:true, breaks:true});
}

function addMessage(text, type, imageUrl) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "message " + type;

  if (imageUrl) {
    const img = document.createElement("img");
    img.src = imageUrl;
    img.className = "preview";
    img.alt = "Uploaded homework";
    div.appendChild(img);
  }

  const content = document.createElement("div");
  if (type === "bot" && window.marked && window.DOMPurify) {
    content.innerHTML = DOMPurify.sanitize(marked.parse(String(text)));
  } else {
    content.textContent = text;
  }
  div.appendChild(content);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function setBotText(element, text) {
  if (window.marked && window.DOMPurify) {
    element.innerHTML = DOMPurify.sanitize(marked.parse(String(text)));
  } else {
    element.textContent = text;
  }
}

function selectImage(input) {
  const selected = input.files[0];
  if (!selected) return;

  if (!["image/jpeg","image/png","image/webp"].includes(selected.type)) {
    alert("Please select a JPG, PNG, or WEBP image.");
    input.value = "";
    return;
  }
  if (selected.size > 5 * 1024 * 1024) {
    alert("Image must be smaller than 5 MB.");
    input.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    selectedImage = {
      base64: reader.result.split(",")[1],
      mimeType: selected.type,
      url: reader.result
    };
    previewImage.src = reader.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(selected);
}

document.getElementById("upload").onclick = () => file.click();
document.getElementById("camera").onclick = () => cameraFile.click();
file.onchange = () => selectImage(file);
cameraFile.onchange = () => selectImage(cameraFile);

document.getElementById("removeImage").onclick = () => {
  selectedImage = null;
  file.value = "";
  cameraFile.value = "";
  preview.style.display = "none";
  previewImage.removeAttribute("src");
};

async function sendMessage() {
  const text = message.value.trim();
  if (!text && !selectedImage) return;

  const image = selectedImage;
  addMessage(text || "Please solve this worksheet.", "user", image?.url);
  message.value = "";
  message.style.height = "auto";
  selectedImage = null;
  file.value = "";
  cameraFile.value = "";
  preview.style.display = "none";
  send.disabled = true;

  const loading = addMessage("Thinking...", "bot");
  try {
    const payload = {message:text};
    if (image) {
      payload.imageBase64 = image.base64;
      payload.mimeType = image.mimeType;
    }

    const response = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.details || data.error || "Request failed.");
    }
    if (!data.answer) {
      throw new Error("ASTRIX returned an empty response.");
    }
    setBotText(loading, data.answer);
  } catch (error) {
    loading.textContent = "ASTRIX couldn't complete that request: " + error.message;
  } finally {
    send.disabled = false;
    message.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

send.onclick = sendMessage;
message.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
message.addEventListener("input", () => {
  message.style.height = "auto";
  message.style.height = Math.min(message.scrollHeight,120) + "px";
});

document.getElementById("clear").onclick = () => {
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="symbol">✦</div>
      <h1>WHAT ARE WE WORKING ON?</h1>
      <p>Ask a question or upload a worksheet.</p>
    </div>`;
};
</script>
</body>
</html>
